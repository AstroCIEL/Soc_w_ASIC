interface remote_bitbang
remote_bitbang_host localhost
remote_bitbang_port 4567

# ── JTAG speed ───────────────────────────────────────────────────────────────
adapter_khz 1000

# ── RISC-V debug module (dm_top / dmi_jtag) ──────────────────────────────────
transport select jtag

# RISC-V debug TAP: IR length = 5 (standard RISC-V debug spec)
jtag newtap riscv cpu -irlen 5 -ignore-version

# ── Target ───────────────────────────────────────────────────────────────────
target create riscv.cpu riscv -chain-position riscv.cpu

# Expose GDB server on port 3333
gdb_port 3333
telnet_port 4444
tcl_port 6666

init
halt
